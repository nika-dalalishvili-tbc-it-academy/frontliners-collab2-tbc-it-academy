<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- styles -->
    <link rel="stylesheet" href="./dist/css/styles.css">
</head>

<body>
    <main>
        <!-- header -->
        <section class="header"></section>

        <!-- options section -->
        <section class="options">
            <div class="options__notebook">
                <h3 class="options__title">Notebook - <span>0/12</span></h3>
                <ul class="options__list">
                    <li>notebook item 1</li>
                </ul>
            </div>
            <div class="options__linkboard">
                <h3 class="options__title">Link Board</h3>

                <div class="options__select-group">
                    <select name="" id="">
                        <option value="">--choose--</option>
                        <option value="">1</option>
                        <option value="">2</option>
                        <option value="">3</option>
                    </select>
                    <select name="" id="">
                        <option value="">--choose--</option>
                        <option value="">1</option>
                        <option value="">2</option>
                        <option value="">3</option>
                    </select>
                </div>
                
                <div class="options__submit-field">
                    <input type="text" name="" id="" />
                    <button>Add Link</button>
                </div>
                <span>No links yet</span>
            </div>
            <div class="options__accuse">
                <h3 class="options__title">Accuse</h3>
                <div class="options__select-group">
                    <select name="" id="">
                        <option value="">--suspect--</option>
                        <option value="">1</option>
                        <option value="">2</option>
                        <option value="">3</option>
                    </select>
                    <select name="" id="">
                        <option value="">--motive--</option>
                        <option value="">1</option>
                        <option value="">2</option>
                        <option value="">3</option>
                    </select>
                </div>
                <button class="">Make Accusation</button>
            </div>
        </section>

        <!-- board section -->
        <section class="board"></section>
    </main>
    <script type="module" src="./source/js/app.mjs"></script>
</body>

</html>
